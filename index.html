let sources=[],curIdx=0,hls=null;
function parseBein(t){
  let lines=t.split("\n"), cur=null, arr=[];
  for(let l of lines){
    l=l.trim(); if(!l)continue;
    if(l.startsWith("#EXTINF")){cur={title:l.split(",").pop().trim()||"beIN", raw:l}}
    else if(cur&&l.startsWith("http")){cur.url=l; let q=cur.title.match(/(\d+x\d+|RAW|FHD|HD|TICARI|EXTRA)/i); cur.label=q?q[0].toUpperCase():`KAYNAK ${arr.length+1}`; arr.push(cur); cur=null}
  }
  return arr;
}
function renderSrc(){
  let grid=document.getElementById("srcGrid"); grid.innerHTML="";
  sources.forEach((s,i)=>{
    let d=document.createElement("div"); d.className="srcChip"+(i==curIdx?" on":""); d.textContent=(i+1)+". "+s.label;
    d.onclick=()=>playIdx(i); grid.appendChild(d);
  });
  document.getElementById("count").textContent=sources.length+" link";
}
function playIdx(i){
  curIdx=i; let s=sources[i]; document.getElementById("status").textContent=`Kaynak ${i+1}/${sources.length} - ${s.label} deneniyor...`; document.getElementById("epg").textContent=`${s.title} | ${s.label} | Kaynak ${i+1}`;
  renderSrc();
  let v=document.getElementById("video");
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  v.pause();
  if(s.url.includes(".m3u8")||s.url.includes("vavoo")||s.url.includes(".m3u")){
    if(Hls.isSupported()){
      hls=new Hls({enableWorker:true,lowLatencyMode:true});
      hls.loadSource(s.url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{}); document.getElementById("status").textContent=`▶ OYNATILIYOR - Kaynak ${i+1} ${s.label}`; setTimeout(()=>document.getElementById("status").style.display="none",2000)});
      hls.on(Hls.Events.ERROR,(ev,data)=>{
        if(data.fatal){
          document.getElementById("status").style.display="block";
          document.getElementById("status").textContent=`✖ Kaynak ${i+1} hata - Sonrakine geçiyor...`;
          setTimeout(()=>{playIdx((i+1)%sources.length)},1500);
        }
      });
    }else{v.src=s.url; v.play()}
  }else{v.src=s.url; v.play().catch(()=>{document.getElementById("status").textContent=`✖ Kaynak ${i+1} oynatamadı - Sonraki...`; setTimeout(()=>playIdx((i+1)%sources.length),1500)});}
  v.onplaying=()=>{document.getElementById("status").style.display="none"; document.getElementById("net").textContent="CANLI "+s.label; let chip=document.querySelectorAll(".srcChip")[i]; if(chip) chip.classList.add("ok")};
  v.onerror=()=>{document.getElementById("status").style.display="block"; document.getElementById("status").textContent=`✖ Hata - Kaynak ${i+1} -> ${i+2}`; let chip=document.querySelectorAll(".srcChip")[i]; if(chip) chip.classList.add("fail"); setTimeout(()=>playIdx((i+1)%sources.length),1200)};
}
sources=parseBein(rawList); renderSrc(); playIdx(0);
document.getElementById("nextSrc").onclick=()=>playIdx((curIdx+1)%sources.length);
document.getElementById("fsBtn").onclick=()=>{let el=document.getElementById("player"); if(!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen()};
</script></body></html>
