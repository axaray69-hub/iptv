<script>
var RAW_M3U="https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/mirti68.m3u";
var M3U_URLS=[
"https://api.allorigins.win/raw?url="+encodeURIComponent(RAW_M3U),
"https://corsproxy.io/?"+encodeURIComponent(RAW_M3U),
"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(RAW_M3U),
"https://cdn.jsdelivr.net/gh/ipmirti68/-p@main/mirti68.m3u",
RAW_M3U
];
var EPG_DEFAULT="https://raw.githubusercontent.com/ipmirti68/epg/refs/heads/main/epg.xml";
var DEFAULT_LOGO="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
var SPEED_TEST_URL="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
var channels=[],epg={},curGroup=null,curTab="live",hls=null,groupOrder=[],favs=[],curCh=null,isVLCMode=false,curVol=1,epgUrlCurrent=EPG_DEFAULT;
try{favs=JSON.parse(localStorage.getItem("mirti_fav")||"[]");}catch(e){favs=[];}

function $(id){return document.getElementById(id);}
function setLoad(p,t){ var f=$("loadFill"), tx=$("loadText"); if(f)f.style.width=p+"%"; if(tx)tx.textContent="%"+p+" "+t; var en=$("epgNow"); if(en)en.textContent=t; }
function saveFav(){try{localStorage.setItem("mirti_fav",JSON.stringify(favs));}catch(e){}}
function isFav(url){return favs.indexOf(url)!=-1;}
function toggleFav(url){ var i=favs.indexOf(url); if(i==-1)favs.push(url); else favs.splice(i,1); saveFav(); renderGrid(); renderGroups(); }
function norm(s){ if(!s)return ""; var t=s+""; t=t.replace(/İ/g,"i").replace(/I/g,"i"); t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,""); t=t.toLowerCase(); t=t.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c"); return t; }
function cleanGroup(g){ var t=(g||"Genel").trim(); t=t.replace(/\s+/g," ").trim(); return t||"Genel"; }
function getTypeByGroup(g,url,rawLine){
  var n=norm(g);
  var u=(url||"").toLowerCase();
  var r=(rawLine||"").toLowerCase();
  if(u.indexOf("radio")!=-1) return "radio";
  if(r.indexOf('radio="true"')!=-1) return "radio";
  if(n.indexOf("radyo")!=-1 || n.indexOf("radio")!=-1) return "radio";
  if(n.indexOf("film")!=-1) return "movie";
  if(n.indexOf("dizi")!=-1) return "series";
  if((u.indexOf(".mp4")!=-1 || u.indexOf(".mkv")!=-1) && n.indexOf("dizi")==-1) return "movie";
  return "live";
}
function parseM3U(t){
  var list=[]; var seen={}; groupOrder=[];
  t=t.replace(/\r/g,""); var lines=t.split("\n"); var cur=null, curLine="";
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(!l)continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; curLine=l;
      var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo)cur.logo=lo[1];
      var id=l.match(/tvg-id="([^"]+)"/i); if(id)cur.tvgId=id[1];
      var gr=l.match(/group-title="([^"]+)"/i); cur.group=cleanGroup(gr?gr[1]:"Genel");
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1);
      if(!seen[cur.group]){seen[cur.group]=1; groupOrder.push(cur.group);}
    }else{
      if(cur && l.charAt(0)!="#"){
        var url=l.split("|")[0].trim().split(/\s+/)[0];
        if(url.indexOf("http")==0){ cur.url=url; cur.type=getTypeByGroup(cur.group, url, curLine); list.push(cur); }
        cur=null; curLine="";
      }
    }
  }
  return list;
}
function parseEPG(xmlText){
  try{
    var p=new DOMParser(), d=p.parseFromString(xmlText,"text/xml"), m={};
    var progs=d.querySelectorAll("programme");
    progs.forEach(function(pr){
      var ch=pr.getAttribute("channel"); var st=pr.getAttribute("start"); var en=pr.getAttribute("stop");
      var ti=pr.querySelector("title"); var title=ti?ti.textContent:"";
      if(!m[ch])m[ch]=[]; m[ch].push({title:title,start:st,stop:en});
    });
    for(var k in m){ m[k].sort(function(a,b){ if(!a.start||!b.start)return 0; return a.start.localeCompare(b.start); }); }
    return m;
  }catch(e){return {};}
}
function parseEPGDate(s){ if(!s)return null; try{ var y=s.substr(0,4), mo=s.substr(4,2)-1, d=s.substr(6,2), h=s.substr(8,2), mi=s.substr(10,2), sec=s.substr(12,2); return new Date(y,mo,d,h,mi,sec); }catch(e){return null;} }
function getEPGNowNext(ch){
  if(!ch)return {now:null,next:null};
  var list=null;
  if(ch.tvgId && epg[ch.tvgId])list=epg[ch.tvgId];
  else if(epg[ch.title])list=epg[ch.title];
  else{ var low=norm(ch.title); for(var k in epg){if(norm(k)==low){list=epg[k];break;}} }
  if(!list||!list.length)return {now:null,next:null};
  var now=new Date(); var nowProg=null,nextProg=null;
  for(var i=0;i<list.length;i++){ var p=list[i]; var st=parseEPGDate(p.start); var en=parseEPGDate(p.stop); if(st&&en){ if(now>=st&&now<en){nowProg=p; if(i+1<list.length)nextProg=list[i+1]; break;} if(now<st && !nowProg){nextProg=p; if(i>0)nowProg=list[i-1]; break;} } else{ if(i==0)nowProg=p; if(i==1)nextProg=p; } }
  if(!nowProg&&list.length){nowProg=list[0]; if(list.length>1)nextProg=list[1];}
  return {now:nowProg,next:nextProg};
}
function getFiltered(){
  var list=[];
  for(var i=0;i<channels.length;i++){
    var c=channels[i];
    if(curTab=="fav"){ if(isFav(c.url)) list.push(c); }
    else if(c.type==curTab) list.push(c);
  }
  if(curGroup){ var f=[]; for(var j=0;j<list.length;j++) if(list[j].group===curGroup) f.push(list[j]); list=f; }
  return list;
}
function renderGroups(){
  var gl=$("groups"); if(!gl)return; gl.innerHTML="";
  for(var i=0;i<groupOrder.length;i++){
    var g=groupOrder[i]; var has=false;
    for(var j=0;j<channels.length;j++){
      if(channels[j].group===g){
        if(curTab=="fav"){ if(isFav(channels[j].url)) has=true; }
        else if(channels[j].type==curTab) has=true;
      }
    }
    if(!has) continue;
    var div=document.createElement("div"); div.className="gChip"+(g==curGroup?" on":""); div.textContent=g;
    div.onclick=(function(gg){return function(){curGroup=gg; renderGrid(); renderGroups();};})(g);
    gl.appendChild(div);
  }
  setTimeout(function(){var el=document.querySelector(".gChip.on"); if(el)el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});},200);
}
function renderGrid(){
  var grid=$("grid"); if(!grid)return; grid.innerHTML=""; var list=getFiltered();
  if(list.length==0 && channels.length==0){ var d=document.createElement("div"); d.style.cssText="grid-column:1/-1;color:#ff9a3d;padding:20px;text-align:center;font-size:11px"; d.textContent="Liste yükleniyor..."; grid.appendChild(d); return; }
  if(list.length==0){ var d2=document.createElement("div"); d2.style.cssText="grid-column:1/-1;color:#888;padding:20px;text-align:center;font-size:11px"; d2.textContent=curTab=="fav"?"Fav yok":"Bu grupta kanal yok"; grid.appendChild(d2); return; }
  if(curTab=="movie" || curTab=="series"){
    grid.className="poster";
    for(var i=0;i<list.length;i++){
      var ch=list[i]; var card=document.createElement("div"); card.className="posterCard";
      var p=document.createElement("div"); p.className="posterImg";
      var img=document.createElement("img"); img.src=ch.logo ? ch.logo : DEFAULT_LOGO; img.loading="lazy"; img.onerror=function(){this.src=DEFAULT_LOGO;}; p.appendChild(img);
      var favBtn=document.createElement("button"); favBtn.className="favBtnCard"+(isFav(ch.url)?" on":""); favBtn.textContent=isFav(ch.url)?"★":"☆"; favBtn.onclick=(function(url){return function(ev){ev.stopPropagation(); toggleFav(url);};})(ch.url); p.appendChild(favBtn);
      var m=document.createElement("div"); m.className="posterTitle";
      var epgNN=getEPGNowNext(ch); var t1=document.createElement("b"); t1.textContent=ch.title; var t2=document.createElement("small"); if(epgNN.now) t2.textContent=epgNN.now.title; else t2.textContent=ch.group; m.appendChild(t1); m.appendChild(t2);
      card.appendChild(p); card.appendChild(m); card.onclick=(function(c){return function(){play(c);};})(ch); grid.appendChild(card);
    }
  }else{
    grid.className="live";
    for(var j=0;j<list.length;j++){
      var ch2=list[j]; var row=document.createElement("div"); row.className="item"+(curCh && curCh.url==ch2.url?" on":"");
      var logoBox=document.createElement("div"); logoBox.className="logoBox"; var img2=document.createElement("img"); img2.src=ch2.logo ? ch2.logo : DEFAULT_LOGO; img2.onerror=function(){this.src=DEFAULT_LOGO;}; logoBox.appendChild(img2);
      var info=document.createElement("div"); info.className="info";
      var b=document.createElement("b"); b.textContent=ch2.title;
      var epgNN2=getEPGNowNext(ch2);
      var s=document.createElement("span"); s.className="simdi";
      if(epgNN2.now) s.textContent=epgNN2.now.title; else s.textContent=ch2.group;
      var nxt=document.createElement("span"); nxt.className="sonra"; if(epgNN2.next) nxt.textContent=epgNN2.next.title;
      info.appendChild(b); info.appendChild(s); if(nxt.textContent) info.appendChild(nxt);
      var favBtn2=document.createElement("button"); favBtn2.className="favBtn"+(isFav(ch2.url)?" on":""); favBtn2.textContent=isFav(ch2.url)?"★":"☆"; favBtn2.onclick=(function(url){return function(ev){ev.stopPropagation(); toggleFav(url);};})(ch2.url);
      row.appendChild(logoBox); row.appendChild(info); row.appendChild(favBtn2);
      row.onclick=(function(c){return function(){play(c);};})(ch2); grid.appendChild(row);
    }
  }
  var lc=0,mc=0,sc=0,rc=0; for(var k=0;k<channels.length;k++){if(channels[k].type=="live")lc++; else if(channels[k].type=="movie")mc++; else if(channels[k].type=="series")sc++; else if(channels[k].type=="radio")rc++;}
  if($("bLive"))$("bLive").innerHTML="📺 Canlı "+lc; if($("bMovie"))$("bMovie").innerHTML="🎬 Film "+mc; if($("bSeries"))$("bSeries").innerHTML="🎞️ Dizi "+sc; if($("bRadio"))$("bRadio").innerHTML="📻 Radyo "+rc; if($("bFav"))$("bFav").innerHTML="⭐ Fav "+favs.length;
}
function resolveM3UFile(url){
  return new Promise(function(res,rej){
    fetch(url,{cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
      var lines=t.split("\n");
      for(var i=0;i<lines.length;i++){ var l=lines[i].trim(); if(l.indexOf("http")==0){ res(l); return; } }
      rej("m3u icinde link yok");
    }).catch(function(e){ rej(e); });
  });
}
function play(ch){
  curCh=ch; var v=$("video"), idle=$("idle");
  if(idle)idle.style.display="none"; if(v){v.style.display="block"; v.removeAttribute("hidden"); v.pause(); v.currentTime=0; v.volume=curVol;}
  var epgNN=getEPGNowNext(ch);
  if($("epgNow")){ if(epgNN.now&&epgNN.next)$("epgNow").textContent=epgNN.now.title+" | "+epgNN.next.title+" | "+ch.title; else if(epgNN.now)$("epgNow").textContent=epgNN.now.title+" | "+ch.title; else $("epgNow").textContent=ch.group+" | "+ch.title; }
  if(hls){try{hls.destroy();}catch(e){} hls=null;}
  var url=ch.url;
  if(url.indexOf(".m3u")!=-1 && url.indexOf(".m3u8")==-1){
    resolveM3UFile(url).then(function(real){ playWithRealUrl(real, v); }).catch(function(){ playWithRealUrl(url, v); });
    renderGrid(); return;
  }
  playWithRealUrl(url, v); renderGrid();
}
function playWithRealUrl(url, v){
  if(isVLCMode){ $("vlcBtn").textContent="VLC Aktif ✓"; $("vlcBtn").classList.add("vlcActive"); }else{ $("vlcBtn").textContent="🎬 VLC İçinde"; $("vlcBtn").classList.remove("vlcActive"); }
  var tryUrls=[url];
  if(url.indexOf("http://")==0){
    tryUrls.push(url.replace("http://","https://"));
    tryUrls.push("https://api.allorigins.win/raw?url="+encodeURIComponent(url));
  }
  function tryNext(index){
    if(index>=tryUrls.length){ $("epgNow").textContent="Yayın yok: "+(curCh?curCh.title:""); return; }
    var u=tryUrls[index];
    $("epgNow").textContent="Deneniyor "+(index+1)+"/"+tryUrls.length+": "+(curCh?curCh.title:"");
    if(u.indexOf(".m3u8")!=-1){
      if(Hls.isSupported()){
        if(hls){try{hls.destroy();}catch(e){}}
        var cfg=isVLCMode?{enableWorker:true,maxBufferLength:60,liveSyncDurationCount:5}:{enableWorker:true};
        hls=new Hls(cfg); hls.loadSource(u); hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED,function(){ v.play().catch(function(){ tryNext(index+1); }); });
        hls.on(Hls.Events.ERROR,function(ev,data){ if(data.fatal){ try{hls.destroy();}catch(e){} tryNext(index+1); }});
      }else{ v.src=u; v.play().catch(function(){ tryNext(index+1); }); }
    }else{
      v.src=u; v.play().then(function(){ $("epgNow").textContent="Oynatılıyor: "+(curCh?curCh.title:""); }).catch(function(){ tryNext(index+1); });
    }
  }
  tryNext(0);
}
function findUlusalGroup(){ for(var i=0;i<groupOrder.length;i++){ var g=groupOrder[i]; if(norm(g).indexOf("ulusal")!=-1)return g; } return null; }
function measureSpeed(url){ return new Promise(function(resolve,reject){ var start=performance.now(); fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error("HTTP "+r.status); return r.blob(); }).then(function(blob){ var end=performance.now(); var bytes=blob.size; var mbps=(bytes*8/1000000)/((end-start)/1000); resolve({mbps:mbps}); }).catch(function(e){reject(e);}); }); }
function doSpeedTest(){ var arc=$("arc"), needle=$("needle"), num=$("speedNum"), infoEl=$("speedInfo"); if(!arc)return; num.textContent="..."; if(infoEl)infoEl.textContent="Ölçülüyor..."; measureSpeed(SPEED_TEST_URL).then(function(res){ var mbps=res.mbps; num.textContent=mbps.toFixed(2); if(infoEl)infoEl.textContent=mbps.toFixed(1)+" Mbps"; $("netSpeed").textContent="Net: "+mbps.toFixed(1)+" Mbps"; var pct=Math.min(mbps,100); var dash=251-pct/100*251; arc.style.strokeDashoffset=dash; var angle=-90+ (pct/100*180); var rad=angle*Math.PI/180; var x=100+60*Math.cos(rad); var y=100+60*Math.sin(rad); needle.setAttribute("x2",x); needle.setAttribute("y2",y); }).catch(function(e){ if(infoEl)infoEl.textContent="Hata"; num.textContent="0.00"; }); }
function loadM3UFromUrls(idx){
  if(idx==null)idx=0;
  if(idx>=M3U_URLS.length){
    setLoad(0,"Tüm linkler başarısız - AYAR'dan ekle");
    $("stat").textContent="Tüm yollar başarısız - Foto'daki liste yok hatası için:\n"+M3U_URLS.join("\n")+"\n\nÇözüm: AYAR > M3U içeriğini yapıştır";
    $("modal").classList.remove("hidden");
    return;
  }
  var url=M3U_URLS[idx];
  setLoad(5+Math.floor(idx/M3U_URLS.length*50),"Deneniyor "+(idx+1)+"/"+M3U_URLS.length);
  $("epgNow").textContent="Foto'daki liste yok - Deneniyor "+(idx+1)+"/"+M3U_URLS.length;
  $("stat").textContent="Deneniyor "+(idx+1)+": "+url.substring(0,120);
  fetch(url,{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error("HTTP "+r.status); return r.text(); }).then(function(t){
    if(t.trim().indexOf("<!DOCTYPE")!=-1 || t.trim().indexOf("<html")!=-1) throw new Error("HTML döndü - 404");
    if(t.length<100) throw new Error("Çok kısa: "+t.length);
    var parsed=parseM3U(t);
    if(parsed.length==0) throw new Error("0 kanal");
    channels=parsed;
    curGroup=groupOrder[0];
    var ul=findUlusalGroup(); if(ul) curGroup=ul;
    setLoad(80,channels.length+" kanal - Gruplar URL sırası");
    renderGroups(); renderGrid();
    fetch(epgUrlCurrent,{cache:"no-store"}).then(function(re){return re.text();}).then(function(xe){ epg=parseEPG(xe); var keys=Object.keys(epg); setLoad(100,keys.length+" EPG | "+channels.length+" kanal - v100"); setTimeout(function(){var lw=$("loadWrap"); if(lw)lw.style.display="none";},800); renderGrid(); }).catch(function(){setLoad(100,channels.length+" kanal - v100"); var lw=$("loadWrap"); if(lw)lw.style.display="none";});
  }).catch(function(e){
    setLoad(3,"Link "+(idx+1)+" hata: "+e.message);
    $("stat").textContent+="\nHata "+(idx+1)+": "+e.message;
    setTimeout(function(){loadM3UFromUrls(idx+1);},400);
  });
}
function toggleVLC(){ isVLCMode=!isVLCMode; var btn=$("vlcBtn"); if(isVLCMode){ btn.textContent="VLC Aktif ✓"; btn.classList.add("vlcActive"); }else{ btn.textContent="🎬 VLC İçinde"; btn.classList.remove("vlcActive"); } if(curCh) play(curCh); }
function init(){
  setLoad(10,"Başlıyor - v100 liste fix - Foto'daki hata çözülüyor");
  $("setBtn").onclick=function(){$("modal").classList.remove("hidden");};
  $("closeBtn").onclick=function(){$("modal").classList.add("hidden");};
  $("leftArrow").onclick=function(){$("groups").scrollBy({left:-140,behavior:"smooth"});};
  $("rightArrow").onclick=function(){$("groups").scrollBy({left:140,behavior:"smooth"});};
  $("netSpeed").onclick=function(){$("speedModal").classList.remove("hidden"); doSpeedTest();};
  $("closeSpeed").onclick=function(){$("speedModal").classList.add("hidden");};
  $("startTest").onclick=function(){doSpeedTest();};
  $("vlcBtn").onclick=function(e){ e.stopPropagation(); toggleVLC(); };
  var tabs=document.querySelectorAll(".top button");
  for(var i=0;i<tabs.length;i++){ tabs[i].addEventListener("click",(function(btn){return function(){ for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on"); btn.classList.add("on"); curTab=btn.dataset.tab; curGroup=null; renderGroups(); renderGrid(); };})(tabs[i])); }
  $("loadBtn").onclick=function(){
    var rawUrl=$("m3uUrl").value.trim();
    var epgIn=$("epgUrl").value.trim();
    var rawText=$("m3uIn").value.trim();
    if(epgIn) epgUrlCurrent=epgIn;
    if(rawText){
      var parsed=parseM3U(rawText);
      if(parsed.length>0){
        channels=parsed; curGroup=groupOrder[0]; renderGroups(); renderGrid();
        $("modal").classList.add("hidden"); setLoad(100,parsed.length+" kanal (yapıştır)"); var lw=$("loadWrap"); if(lw)lw.style.display="none";
        if(epgUrlCurrent) fetch(epgUrlCurrent).then(function(r){return r.text();}).then(function(x){epg=parseEPG(x); renderGrid();});
        return;
      }
    }
    if(rawUrl){
      fetch(rawUrl,{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){
        channels=parseM3U(t); curGroup=groupOrder[0]; renderGroups(); renderGrid();
        $("modal").classList.add("hidden"); setLoad(100,channels.length+" kanal"); var lw=$("loadWrap"); if(lw)lw.style.display="none";
        if(epgUrlCurrent) fetch(epgUrlCurrent).then(function(r){return r.text();}).then(function(x){epg=parseEPG(x); renderGrid();});
      }).catch(function(e){ $("stat").textContent="Hata: "+e.message; });
    }
  };
  loadM3UFromUrls(0);
  setTimeout(function(){doSpeedTest();},1200);
}
init();
</script>
